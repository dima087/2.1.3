<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ремонт техники различных брендов</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="reset.css">
</head>
<body>
<div class="container">
    <h2>Ремонт техники различных брендов</h2>
    <div class="grid-container" id="gridContainer">
        <div class="card">
            <img src="img/lenovo.svg" alt="Логотип lenovo" width="108" height="32">
            <button class="button-logo"></button>
        </div>
        <div class="card">
            <img src="img/samsung.svg" alt="Логотип Samsung" width="116" height="38">
            <button class="button-logo"></button>
        </div>
        <div class="card">
            <img src="img/apple.svg" alt="Логотип Apple" width="44" height="44">
            <button class="button-logo"></button>
        </div>
        <div class="card">
            <img src="img/viewsonic.svg" alt="Логотип ViewSonic" width="128" height="21">
            <button class="button-logo"></button>
        </div>
        <div class="card">
            <img src="img/bosch.svg" alt="Логотип Bosch" width="128" height="28">
            <button class="button-logo"></button>
        </div>
        <div class="card">
            <img src="img/hp.svg" alt="Логотип HP" width="52" height="52">
            <button class="button-logo"></button>
        </div>
        <div class="card">
            <img src="img/acer.svg" alt="Логотип Acer" width="94" height="24">
            <button class="button-logo"></button>
        </div>
        <div class="card">
            <img src="img/sony.svg" alt="Логотип Sony" width="128" height="25">
            <button class="button-logo"></button>
        </div>
        <div class="card">
            <img src="img/lenovo.svg" alt="Логотип lenovo" width="108" height="32">
            <button class="button-logo"></button>
        </div>
        <div class="card">
            <img src="img/samsung.svg" alt="Логотип Samsung" width="116" height="38">
            <button class="button-logo"></button>
        </div>
        <div class="card">
            <img src="img/apple.svg" alt="Логотип Apple" width="44" height="44">
            <button class="button-logo"></button>
        </div>
    </div>
    <div class="swiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide">Слайд 1</div>
            <div class="swiper-slide">Слайд 2</div>
            <div class="swiper-slide">Слайд 3</div>
            <div class="swiper-slide">Слайд 4</div>
            <div class="swiper-slide">Слайд 5</div>
            <div class="swiper-slide">Слайд 6</div>
            <div class="swiper-slide">Слайд 7</div>
            <div class="swiper-slide">Слайд 8</div>
            <div class="swiper-slide">Слайд 9</div>
        </div>
        <!-- Опционально: пагинация -->
        <div class="swiper-pagination"></div>
    </div>
    <button class="button-end">
        <img class="img" id="img-end" src="img/ic_expand.svg" alt="Стрелка">
        <span id="toggleBtn" class="button-readmore__text">Скрыть</span>
    </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
<script src="index.js"></script>
</body>
</html>
